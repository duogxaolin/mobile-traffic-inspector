name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install './backend[test]'
      - name: Run backend tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://localhost/test
          APPLICATION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          SESSION_SECRET: ci-session-secret
          INGEST_TOKEN: ci-ingest-token
          ADMIN_PASSWORD: ci-admin-password
        run: python -m pytest -q -p no:cacheprovider backend/tests

  capture:
    name: Capture tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: capture/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r capture/requirements.txt pytest==8.3.2
      - run: PYTHONPATH=capture python -m pytest -q -p no:cacheprovider capture/tests

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm test -- --run
      - working-directory: web
        run: npm run build
      - working-directory: web
        run: npm audit --omit=dev

  infrastructure:
    name: Infrastructure checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create empty local secret placeholders for Compose validation
        run: |
          install -d -m 700 secrets
          touch secrets/postgres_password.txt secrets/application_key.txt secrets/session_secret.txt
          touch secrets/ingest_token.txt secrets/admin_password.txt
      - name: Validate Compose and shell scripts
        env:
          SITE_ADDRESS: inspector.example.test
          ACME_EMAIL: ops@example.test
        run: |
          docker compose config -q
          bash -n scripts/*.sh
          bash scripts/validate-no-secrets.sh
          ruby -e 'Dir[".github/workflows/*.{yml,yaml}"].each { |f| YAML.load_file(f) }' -ryaml
      - name: Build container images
        run: docker compose build
