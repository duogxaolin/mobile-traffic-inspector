name: mobile-traffic-inspector

services:
  volume-init:
    image: alpine:3.20
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        ensure_owner() {
          [ "$(stat -c '%u:%g' "$1")" = "$2" ] || chown -R "$2" "$1"
        }
        ensure_body_group() {
          [ "$(stat -c '%g' "$1")" = "999" ] || chown -R 10001:999 "$1"
        }
        ensure_body_group /bodies
        ensure_owner /capture-spool 10001:999
        ensure_owner /capture-state 10001:999
        ensure_owner /mitmproxy-state 10001:999
        chmod 0770 /bodies /capture-spool /capture-state /mitmproxy-state
        ensure_owner /public-ca 10001:10001
        ensure_owner /caddy-data 10001:10001
        ensure_owner /caddy-config 10001:10001
        chmod 0750 /public-ca /caddy-data /caddy-config
    volumes:
      - body_data:/bodies
      - capture_spool:/capture-spool
      - capture_state:/capture-state
      - mitmproxy_state:/mitmproxy-state
      - public_ca:/public-ca
      - caddy_data:/caddy-data
      - caddy_config:/caddy-config
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: traffic_inspector
      POSTGRES_USER: traffic_inspector
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic_inspector -d traffic_inspector"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      APPLICATION_KEY_FILE: /run/secrets/application_key
      SESSION_SECRET_FILE: /run/secrets/session_secret
      INGEST_TOKEN_FILE: /run/secrets/ingest_token
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      BODY_ROOT: /var/lib/traffic-inspector/bodies
      PREVIEW_BYTES: ${PREVIEW_BYTES:-262144}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-0}
    secrets:
      - database_url
      - application_key
      - session_secret
      - ingest_token
      - admin_password
    volumes:
      - body_data:/var/lib/traffic-inspector/bodies
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  capture:
    build:
      context: ./capture
    restart: unless-stopped
    command:
      - mitmdump
      - --mode
      - wireguard@${WIREGUARD_PORT:-51820}
      - --set
      - connection_strategy=lazy
      - --set
      - stream_large_bodies=1
      - --scripts
      - /app/inspector_addon.py
    environment:
      INSPECTOR_API_URL: http://api:8000/internal/ingest
      INGEST_TOKEN_FILE: /run/secrets/ingest_token
      APPLICATION_KEY_FILE: /run/secrets/application_key
      CAPTURE_SPOOL: /var/lib/traffic-inspector/spool
      CAPTURE_STATE: /var/lib/traffic-inspector/state
      PUBLIC_CA_ROOT: /var/lib/traffic-inspector/public-ca
      SAFE_DESTINATION_OVERRIDES: ${SAFE_DESTINATION_OVERRIDES:-}
      MAX_INGEST_QUEUE: 2048
    secrets:
      - ingest_token
      - application_key
    volumes:
      - mitmproxy_state:/home/mitmproxy/.mitmproxy
      - capture_spool:/var/lib/traffic-inspector/spool
      - capture_state:/var/lib/traffic-inspector/state
      - body_data:/var/lib/traffic-inspector/bodies
      - public_ca:/var/lib/traffic-inspector/public-ca
    networks:
      - internal
      - edge
    depends_on:
      api:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    ports:
      - "${WIREGUARD_PORT:-51820}:${WIREGUARD_PORT:-51820}/udp"
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - public_ca:/srv/public-ca:ro
    networks:
      - internal
      - edge
    depends_on:
      api:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PANEL_HTTP_PORT:-8080}:8080/tcp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2018/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run:size=8m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  edge:
  internal:
    internal: true

volumes:
  postgres_data:
  body_data:
  capture_spool:
  capture_state:
  mitmproxy_state:
  public_ca:
  caddy_data:
  caddy_config:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  database_url:
    file: ./secrets/database_url.txt
  application_key:
    file: ./secrets/application_key.txt
  session_secret:
    file: ./secrets/session_secret.txt
  ingest_token:
    file: ./secrets/ingest_token.txt
  admin_password:
    file: ./secrets/admin_password.txt
