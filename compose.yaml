name: mobile-traffic-inspector

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: traffic_inspector
      POSTGRES_USER: traffic_inspector
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic_inspector -d traffic_inspector"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      APPLICATION_KEY_FILE: /run/secrets/application_key
      SESSION_SECRET_FILE: /run/secrets/session_secret
      INGEST_TOKEN_FILE: /run/secrets/ingest_token
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      BODY_ROOT: /var/lib/traffic-inspector/bodies
      PREVIEW_BYTES: ${PREVIEW_BYTES:-262144}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-0}
    secrets:
      - database_url
      - application_key
      - session_secret
      - ingest_token
      - admin_password
    volumes:
      - body_data:/var/lib/traffic-inspector/bodies
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  capture:
    build:
      context: ./capture
    restart: unless-stopped
    command:
      - mitmdump
      - --mode
      - wireguard@${WIREGUARD_PORT:-51820}
      - --set
      - connection_strategy=lazy
      - --set
      - stream_large_bodies=1
      - --listen-port
      - ${WIREGUARD_PORT:-51820}
      - --scripts
      - /app/inspector_addon.py
    environment:
      INSPECTOR_API_URL: http://api:8000/internal/ingest
      INGEST_TOKEN_FILE: /run/secrets/ingest_token
      APPLICATION_KEY_FILE: /run/secrets/application_key
      CAPTURE_SPOOL: /var/lib/traffic-inspector/spool
      CAPTURE_STATE: /var/lib/traffic-inspector/state
      SAFE_DESTINATION_OVERRIDES: ${SAFE_DESTINATION_OVERRIDES:-}
      MAX_INGEST_QUEUE: 2048
    secrets:
      - ingest_token
      - application_key
    volumes:
      - mitmproxy_state:/home/mitmproxy/.mitmproxy
      - capture_spool:/var/lib/traffic-inspector/spool
      - capture_state:/var/lib/traffic-inspector/state
      - body_data:/var/lib/traffic-inspector/bodies
    networks:
      - internal
      - edge
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WIREGUARD_PORT:-51820}:${WIREGUARD_PORT:-51820}/udp"
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - mitmproxy_state:/srv/mitmproxy:ro
    networks:
      - internal
      - edge
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "443:443/tcp"
      - "443:443/udp"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run:size=8m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  edge:
  internal:
    internal: true

volumes:
  postgres_data:
  body_data:
  capture_spool:
  capture_state:
  mitmproxy_state:
  caddy_data:
  caddy_config:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  database_url:
    file: ./secrets/database_url.txt
  application_key:
    file: ./secrets/application_key.txt
  session_secret:
    file: ./secrets/session_secret.txt
  ingest_token:
    file: ./secrets/ingest_token.txt
  admin_password:
    file: ./secrets/admin_password.txt
